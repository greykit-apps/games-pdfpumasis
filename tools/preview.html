<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>PDF Pumasis: the ship sheet</title>
<meta name="color-scheme" content="dark">
<style>
  body { margin: 0; background: #0b1017; color: #e9e4d8; font: 14px/1.4 "Segoe UI", system-ui, sans-serif; padding: 16px; }
  h1 { font-size: 18px; margin: 0 0 4px; } p { margin: 0 0 12px; color: #9aa3ad; }
  .row { display: flex; align-items: flex-end; gap: 10px; margin: 0 0 6px; padding: 8px; background: linear-gradient(#5a8cc4 0 55%, #2f5f86 55%); border-radius: 4px; flex-wrap: wrap; }
  .row.dusk { background: linear-gradient(#5a3a66 0 55%, #1f3448 55%); } .row.night { background: linear-gradient(#0a1228 0 55%, #08131f 55%); }
  .name { width: 110px; flex: none; align-self: center; font-weight: 600; } .name small { display: block; color: #9aa3ad; font-weight: 400; }
  canvas { image-rendering: pixelated; }
</style>
</head>
<body>
<h1>PDF Pumasis: the ship sheet</h1>
<p>Every class, traced from its model: bow-on, quarter, beam, quarter astern, stern-on. <code>?light=day|dusk|night</code> · <code>?size=72</code> · <code>?scale=2</code></p>
<div id="out"></div>
<script src="../js/util.js"></script>
<script src="../js/engine/const.js"></script>
<script src="../js/art/kit.js"></script>
<script src="../js/art/model.js"></script>
<script src="../js/art/ships.js"></script>
<script>
  const q = new URLSearchParams(location.search), light = q.get("light") || "day", size = +(q.get("size") || 90), scale = +(q.get("scale") || 2);
  const A = PD.ShipArt, out = document.getElementById("out");
  const LIST = [["pumasis", "Pumasis", "PDF, hullborne"], ["pumasis+", "Pumasis", "PDF, foilborne"], ["lynx", "Lynx", "PDF, hullborne"], ["lynx+", "Lynx", "PDF, foilborne"], ["ocelot", "Ocelot", "PDF, hullborne"], ["ocelot+", "Ocelot", "PDF, foilborne"],
    ["patrol", "Cutter", "PDF"], ["cur", "Cur", "Wolf patrol boat"], ["jackal", "Jackal", "Wolf patrol craft"], ["whelp", "Whelp", "Wolf, 2 Howlers"], ["lupa1", "Lupa I", "Wolf, 4 Howlers"], ["lupa2", "Lupa II", "Wolf, 4 long Howlers"],
    ["warg", "Warg", "Wolf corvette"], ["fenrir", "Fenrir", "Wolf corvette"], ["coyoteA", "Coyote", "Wolf, Bites"], ["coyoteB", "Coyote", "Wolf, 76mm"], ["cargo", "Cargo ship", "neutral"], ["star", "Tawny Star", "container ship"], ["supply", "Sable Dawn", "supply ship"], ["helo", "Kestrel", "PDF helicopter"]];
  let i = 0;
  function next() {
    if (i >= LIST.length) return;
    const [cls, n, note] = LIST[i++], row = document.createElement("div");
    row.className = "row " + light;
    row.innerHTML = `<div class="name">${n}<small>${note}</small></div>`;
    const big = ["cargo", "star", "supply"].includes(cls) ? size * 1.8 : size;
    for (const bin of [0, 4, 8, 12, 16]) {
      const c = A.sprite(cls, bin, A.sizeFor(big), light), o = document.createElement("canvas");
      o.width = c.width * scale; o.height = c.height * scale;
      const g = o.getContext("2d"); g.imageSmoothingEnabled = false; g.drawImage(c, 0, 0, o.width, o.height);
      row.appendChild(o);
    }
    out.appendChild(row);
    setTimeout(next, 0);
  }
  next();
</script>
</body>
</html>
